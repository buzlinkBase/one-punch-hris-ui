services:
  hris-frontend:
    # Image is pulled from Docker Hub — never built on the server.
    # DOCKER_IMAGE is supplied inline by the CI deploy step (see ci.yml).
    image: ${DOCKER_IMAGE}
    ports:
      - "${HOST_PORT}:80"
    restart: unless-stopped
    networks:
      - hris-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hris-network:
    driver: bridge
