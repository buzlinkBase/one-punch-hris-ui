version: '3.8'

services:
  hris-frontend:
    # DOCKER_IMAGE is set in .env on the VPS (e.g. youruser/hris-react:latest)
    # Falls back to a local build tag when developing locally
    image: ${DOCKER_IMAGE:-hris-react:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:1442/}
        VITE_API_VERSION: ${VITE_API_VERSION:-v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-One Punch HRIS}
    container_name: hris-frontend
    ports:
      - "${HOST_PORT:-80}:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:1442/}
      - VITE_API_VERSION=${VITE_API_VERSION:-v1}
      - VITE_APP_NAME=${VITE_APP_NAME:-One Punch HRIS}
    restart: unless-stopped
    networks:
      - hris-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Optional: Add logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hris-network:
    driver: bridge

