name: CI / CD

on:
  push:
    branches:
      # - main
      - dev
      # - production
  pull_request:
    branches:
      # - main
      - dev
      # - production
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "11.12.0"
  NODE_VERSION: "24.18.0"
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hris-react

permissions:
  contents: read

jobs:
  # ─── Job 0: Dependency Audit ──────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run pnpm audit (retry on registry timeout)
        run: |
          for attempt in 1 2 3; do
            if pnpm audit --audit-level=high; then
              exit 0
            fi
            echo "pnpm audit failed (attempt $attempt/3)" >&2
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

  # ─── Job 1: ESLint static analysis ────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ─── Job 2: Prettier format check ────────────────────────────────────────
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: |
          pnpm format:check || (echo "" && echo "Formatting issues found. Run 'pnpm format' locally to fix, then commit the changes." && exit 1)

  # ─── Job 3: TypeScript type-check ─────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b --noEmit

  # ─── Job 4: Verify the app actually builds ────────────────────────────────
  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build

  # ─── Job 5: Build Docker image and push to Docker Hub ──────────────────────
  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [audit, lint, format-check, type-check, build]
    # Restricted to dev branch only
    if: github.event_name == 'push' && contains(fromJSON('["dev"]'), github.ref_name)
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}-latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_API_VERSION=${{ vars.VITE_API_VERSION }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_PREFIX_AUTH=${{ vars.VITE_PREFIX_AUTH }}
            VITE_PREFIX_HRMS=${{ vars.VITE_PREFIX_HRMS }}
            VITE_PREFIX_ADMS=${{ vars.VITE_PREFIX_ADMS }}
            VITE_PREFIX_TENANTS=${{ vars.VITE_PREFIX_TENANTS }}
            VITE_PREFIX_NOTIFICATIONS=${{ vars.VITE_PREFIX_NOTIFICATIONS }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  # ─── Job 6: Deploy to DigitalOcean VPS via SSH ────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-publish]
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            cd "/opt/hris-react/$BRANCH"

            # Pull the newly published image for this branch
            DOCKER_IMAGE="${{ vars.DOCKER_IMAGE }}:${{ github.ref_name }}-latest" \
            HOST_PORT="${{ vars.HOST_PORT }}" \
            docker compose -p "hris-$BRANCH" pull

            # Bring up new container, remove orphaned instances
            DOCKER_IMAGE="${{ vars.DOCKER_IMAGE }}:${{ github.ref_name }}-latest" \
            HOST_PORT="${{ vars.HOST_PORT }}" \
            docker compose -p "hris-$BRANCH" up -d --remove-orphans

            # Clean up old images
            docker image prune -f
