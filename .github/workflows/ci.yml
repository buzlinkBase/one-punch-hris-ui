name: CI / CD

on:
  push:
    branches:
      - main
      - dev
      - production
  pull_request:
    branches:
      - main
      - dev
      - production
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.32.1'
  NODE_VERSION: '20.19.1'
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hris-react

permissions:
  contents: write

jobs:
  # ─── Job 1: ESLint static analysis ────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ─── Job 2: TypeScript type-check ─────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b --noEmit

  # ─── Job 3: Derive this branch's release tag from package.json ────────────
  version-tag:
    name: Version & Tag
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    if: github.event_name == 'push'
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and compute branch-scoped tag
        id: read
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME}-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create git tag if it doesn't exist yet
        run: |
          if git rev-parse "${{ steps.read.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.read.outputs.tag }} already exists, skipping"
          else
            git tag "${{ steps.read.outputs.tag }}"
            git push origin "${{ steps.read.outputs.tag }}"
          fi

  # ─── Job 4: Build Docker image and push to Docker Hub ─────────────────────
  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs: [version-tag]
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ needs.version-tag.outputs.tag }}
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}-latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_API_VERSION=${{ vars.VITE_API_VERSION }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
          # Layer cache from the registry for faster rebuilds
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  # ─── Job 5: Deploy to DigitalOcean VPS via SSH ────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [version-tag, docker-publish]
    environment: ${{ github.ref_name }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            cd "/opt/hris-react/$BRANCH"

            # Pull the newly published image for this branch's release
            DOCKER_IMAGE="${{ env.DOCKER_IMAGE }}:${{ needs.version-tag.outputs.tag }}" docker compose -p "hris-$BRANCH" pull

            # Zero-downtime restart: bring up new container, remove old
            DOCKER_IMAGE="${{ env.DOCKER_IMAGE }}:${{ needs.version-tag.outputs.tag }}" docker compose -p "hris-$BRANCH" up -d --remove-orphans

            # Clean up dangling images to free disk space
            docker image prune -f
