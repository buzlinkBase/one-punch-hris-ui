name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.32.1'
  NODE_VERSION: '20.19.1'

# Restrict default token permissions across all jobs.
permissions:
  contents: read

jobs:
  # ─── Job 1: ESLint static analysis ────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  # ─── Job 2: TypeScript type-check (parallel with lint) ────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript compiler
        run: pnpm exec tsc -b --noEmit

  # ─── Job 3: Production build verification ─────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    permissions:
      contents: read
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:1442/' }}
      VITE_API_VERSION: ${{ vars.VITE_API_VERSION || 'v1' }}
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME || 'One Punch HRIS' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Report build size
        run: du -sh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ─── Job 4: Preview deploy stub (configure when deployment target is known) ─
  preview-deploy:
    name: Preview Deploy
    runs-on: ubuntu-latest
    needs: [build]
    permissions: {}
    # Only run on pushes to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      # TODO: Replace this step with your actual deployment action once the
      # deployment target is chosen (GitHub Pages, Vercel, Netlify, etc.).
      # Example for GitHub Pages:
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: ./dist
      - name: Deploy (stub)
        run: |
          echo "Deployment target not yet configured."
          echo "Replace this step with the appropriate deployment action."
          echo "Build artifact is ready in ./dist/"

      # TODO: Update DEPLOY_URL once deployment target is configured.
      # - name: Smoke test
      #   run: |
      #     curl --fail --silent --show-error --retry 3 --retry-delay 5 "$DEPLOY_URL"
