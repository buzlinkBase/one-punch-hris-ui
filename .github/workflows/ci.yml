name: CI / CD

on:
  push:
    branches:
      - main
      - dev
      - production
  pull_request:
    branches:
      - main
      - dev
      - production
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "11.12.0"
  NODE_VERSION: "24.18.0"
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hris-react

# Least-privilege default: everything only needs to read the repo.
permissions:
  contents: read

jobs:
  # ─── Job 0: Fail if dependencies have known high/critical vulnerabilities ──
  # actions/dependency-review-action requires GitHub Advanced Security, which
  # isn't available on free-tier private repos — pnpm audit needs no special
  # GitHub feature and checks the same advisory database.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # No `cache: pnpm` here — this job never runs `pnpm install`, so the
      # pnpm store is never populated and there'd be nothing to cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The advisory bulk endpoint on the npm registry occasionally times out
      # under CI network conditions. pnpm already retries internally, but if
      # the registry stays unresponsive it still aborts the whole job — so
      # retry the command itself a few times before failing the pipeline.
      - name: Run pnpm audit (retry on registry timeout)
        run: |
          for attempt in 1 2 3; do
            if pnpm audit --audit-level=high; then
              exit 0
            fi
            echo "pnpm audit failed (attempt $attempt/3)" >&2
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

  # ─── Job 1: ESLint static analysis ────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ─── Job 2: Prettier format check ────────────────────────────────────────
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: |
          pnpm format:check || (echo "" && echo "Formatting issues found. Run 'pnpm format' locally to fix, then commit the changes." && exit 1)

  # ─── Job 3: TypeScript type-check ─────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b --noEmit

  # ─── Job 4: Verify the app actually builds ────────────────────────────────
  # Runs in parallel with lint/format-check/type-check rather than after them —
  # it doesn't depend on their results, and type-check already covers `tsc -b`,
  # so this skips straight to `vite build` to avoid re-running the type-check.
  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build

  # ─── Job 5: Build Docker image and push to Docker Hub ──────────────────────
  # NOTE: versioning (semantic-release) removed for now — revisit once
  # deployment is stable. Images are tagged by branch + commit SHA only.
  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [audit, lint, format-check, type-check, build]
    if: github.event_name == 'push' && contains(fromJSON('["dev","production"]'), github.ref_name)
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Skip provenance/SBOM attestation generation — it adds an extra
          # manifest-list step that isn't needed for this deployment.
          provenance: false
          sbom: false
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}-latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_API_VERSION=${{ vars.VITE_API_VERSION }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_PREFIX_AUTH=${{ vars.VITE_PREFIX_AUTH }}
            VITE_PREFIX_HRMS=${{ vars.VITE_PREFIX_HRMS }}
            VITE_PREFIX_ADMS=${{ vars.VITE_PREFIX_ADMS }}
            VITE_PREFIX_TENANTS=${{ vars.VITE_PREFIX_TENANTS }}
            VITE_PREFIX_NOTIFICATIONS=${{ vars.VITE_PREFIX_NOTIFICATIONS }}
          # Layer cache from the registry for faster rebuilds
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  # ─── Job 6: Deploy to DigitalOcean VPS via SSH ────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-publish]
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            cd "/opt/hris-react/$BRANCH"

            # Pull the newly published image for this branch
            DOCKER_IMAGE="${{ vars.DOCKER_IMAGE }}:${{ github.ref_name }}-latest" \
            HOST_PORT="${{ vars.HOST_PORT }}" \
            docker compose -p "hris-$BRANCH" pull

            # Zero-downtime restart: bring up new container, remove old
            DOCKER_IMAGE="${{ vars.DOCKER_IMAGE }}:${{ github.ref_name }}-latest" \
            HOST_PORT="${{ vars.HOST_PORT }}" \
            docker compose -p "hris-$BRANCH" up -d --remove-orphans

            # Clean up dangling images to free disk space
            docker image prune -f
