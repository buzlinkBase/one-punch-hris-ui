name: CI / CD

on:
  push:
    branches:
      - main
      - dev
      - production
      - "feature/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - dev
      - production
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.32.1"
  NODE_VERSION: "20.19.1"
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hris-react

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ─── Job 1: ESLint static analysis ────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ─── Job 2: TypeScript type-check ─────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b --noEmit

  # ─── Job 3: Verify the app actually builds ────────────────────────────────
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # ─── Job 4: Build Docker image and push to Docker Hub ──────────────────────
  # NOTE: versioning (semantic-release) removed for now — revisit once
  # deployment is stable. Images are tagged by branch + commit SHA only.
  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && contains(fromJSON('["dev","production"]'), github.ref_name)
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}-latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_API_VERSION=${{ vars.VITE_API_VERSION }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_PREFIX_AUTH=${{ vars.VITE_PREFIX_AUTH }}
            VITE_PREFIX_HRMS=${{ vars.VITE_PREFIX_HRMS }}
            VITE_PREFIX_ADMS=${{ vars.VITE_PREFIX_ADMS }}
            VITE_PREFIX_TENANTS=${{ vars.VITE_PREFIX_TENANTS }}
            VITE_PREFIX_NOTIFICATIONS=${{ vars.VITE_PREFIX_NOTIFICATIONS }}
          # Layer cache from the registry for faster rebuilds
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  # ─── Job 5: Deploy to DigitalOcean VPS via SSH ────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [docker-publish]
    environment: ${{ github.ref_name }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            cd "/opt/hris-react/$BRANCH"

            # Pull the newly published image for this branch
            DOCKER_IMAGE="${{ vars.DOCKER_IMAGE }}:${{ github.ref_name }}-latest" \
            HOST_PORT="${{ vars.HOST_PORT }}" \
            docker compose -p "hris-$BRANCH" pull

            # Zero-downtime restart: bring up new container, remove old
            DOCKER_IMAGE="${{ vars.DOCKER_IMAGE }}:${{ github.ref_name }}-latest" \
            HOST_PORT="${{ vars.HOST_PORT }}" \
            docker compose -p "hris-$BRANCH" up -d --remove-orphans

            # Clean up dangling images to free disk space
            docker image prune -f
