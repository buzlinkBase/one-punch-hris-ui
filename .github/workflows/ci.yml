name: CI / CD

on:
  push:
    branches:
      - main
      - dev
      - production
      - "feature/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - dev
      - production
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.32.1"
  NODE_VERSION: "20.19.1"
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hris-react

# Least-privilege default: everything only needs to read the repo.
permissions:
  contents: read

jobs:
  # ─── Job 0: Block PRs that introduce vulnerable or malicious dependencies ──
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@e7aeea1772ec01da74cafda11c5caa463520ca59 # v3

  # ─── Job 1: ESLint static analysis ────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ─── Job 2: Prettier format check ────────────────────────────────────────
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: |
          pnpm format:check || (echo "" && echo "Formatting issues found. Run 'pnpm format' locally to fix, then commit the changes." && exit 1)

  # ─── Job 3: TypeScript type-check ─────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b --noEmit

  # ─── Job 4: Verify the app actually builds ────────────────────────────────
  # Runs in parallel with lint/format-check/type-check rather than after them —
  # it doesn't depend on their results, and type-check already covers `tsc -b`,
  # so this skips straight to `vite build` to avoid re-running the type-check.
  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build

  # ─── Job 5: Build Docker image and push to Docker Hub ──────────────────────
  # NOTE: versioning (semantic-release) removed for now — revisit once
  # deployment is stable. Images are tagged by branch + commit SHA only.
  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, format-check, type-check, build]
    if: github.event_name == 'push' && contains(fromJSON('["dev","production"]'), github.ref_name)
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Skip provenance/SBOM attestation generation — it adds an extra
          # manifest-list step that isn't needed for this deployment.
          provenance: false
          sbom: false
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}-latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_API_VERSION=${{ vars.VITE_API_VERSION }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_PREFIX_AUTH=${{ vars.VITE_PREFIX_AUTH }}
            VITE_PREFIX_HRMS=${{ vars.VITE_PREFIX_HRMS }}
            VITE_PREFIX_ADMS=${{ vars.VITE_PREFIX_ADMS }}
            VITE_PREFIX_TENANTS=${{ vars.VITE_PREFIX_TENANTS }}
            VITE_PREFIX_NOTIFICATIONS=${{ vars.VITE_PREFIX_NOTIFICATIONS }}
          # Layer cache from the registry for faster rebuilds
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  # ─── Job 6: Deploy to DigitalOcean VPS via SSH ────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-publish]
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            cd "/opt/hris-react/$BRANCH"

            # Pull the newly published image for this branch
            DOCKER_IMAGE="${{ vars.DOCKER_IMAGE }}:${{ github.ref_name }}-latest" \
            HOST_PORT="${{ vars.HOST_PORT }}" \
            docker compose -p "hris-$BRANCH" pull

            # Zero-downtime restart: bring up new container, remove old
            DOCKER_IMAGE="${{ vars.DOCKER_IMAGE }}:${{ github.ref_name }}-latest" \
            HOST_PORT="${{ vars.HOST_PORT }}" \
            docker compose -p "hris-$BRANCH" up -d --remove-orphans

            # Clean up dangling images to free disk space
            docker image prune -f
